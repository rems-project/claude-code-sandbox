
# Some distros have a patch for this knob, which by default prevents basic
# unprivileged `bwrap` operation (and other container systems).
-kernel.unprivileged_userns_clone = 1

# Ubuntu-specific knob to require apparmor profiles for userns.
# https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
-kernel.apparmor_restrict_unprivileged_userns = 0

# Enable IPv4 forwarding, required for e.g. isolated network. Normally set
# elsewhere, here for convenience.
net.ipv4.ip_forward = 1
